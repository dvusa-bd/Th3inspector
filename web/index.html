function settings(){$('#view').innerHTML='<div class="card"><h3>Language</h3><button id="en">English</button> <button id="bn">বাংলা</button><hr><h3>Workspace</h3><div class="toolbar"><button id="backup">'+t('backup')+'</button><button id="restore">'+t('restore')+'</button><button class="danger" id="reset">Reset local scripts</button></div><p class="label">Scripts are stored in this browser localStorage. Back up regularly.</p></div>';$('#en').onclick=function(){setLang('en')};$('#bn').onclick=function(){setLang('bn')};$('#backup').onclick=backup;$('#restore').onclick=function(){var i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async function(){try{var x=JSON.parse(await i.files[0].text());if(!Array.isArray(x.scripts))throw Error('Invalid backup');scripts=x.scripts;persist();render()}catch(e){alert(e.message)}};i.click()};$('#reset').onclick=function(){if(confirm('Delete local scripts?')){scripts=[];persist();render()}}}
function backup(){download('th3inspector-studio-backup.json',JSON.stringify({app:'Th3inspector Studio',version:'2.0',scripts:scripts},null,2),'application/json')}
function importFiles(){ $('#files').click() }
$('#files').onchange=async function(e){for(var f of e.target.files){var code=await f.text();var m=code.match(/@name\s+([^\r\n]+)/);scripts.unshift({id:crypto.randomUUID(),name:(m&&m[1].trim())||f.name,file:f.name,code:code,enabled:true,updated:Date.now()})}persist();e.target.value='';go('library')};
function setLang(l){lang=l;localStorage.setItem('th3-lang',l);render()}
$('#lang').onclick=function(){setLang(lang==='en'?'bn':'en')};$('#importBtn').onclick=importFiles;$('#menu').onclick=function(){$('#side').classList.toggle('open')};load();render();
})();
